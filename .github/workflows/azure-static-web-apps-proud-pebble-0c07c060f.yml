name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - about
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - about

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build Angular app
        run: npm run build -- --configuration production
        env:
          CI: true
      
      - name: Debug - List dist contents
        run: |
          echo "=== Full dist structure ==="
          find dist -type f -name "*.html" | head -20
          echo "=== Browser folder contents ==="
          ls -la dist/recipefinder/browser/ || echo "Browser folder not found"
          echo "=== Checking for index.html ==="
          find dist -name "index.html"
      
      - name: Copy staticwebapp.config.json to output
        run: |
          if [ -f staticwebapp.config.json ]; then
            cp staticwebapp.config.json dist/recipefinder/browser/
          fi
      
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PROUD_PEBBLE_0C07C060F }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"
          api_location: ""
          output_location: "dist/recipefinder/browser"
          skip_app_build: true
          
  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PROUD_PEBBLE_0C07C060F }}
          action: "close"