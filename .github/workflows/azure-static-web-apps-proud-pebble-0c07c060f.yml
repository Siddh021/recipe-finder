name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - Siddh021-readme
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - Siddh021-readme

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build Angular app (Static)
        run: npm run build:swa
      
      - name: Copy config file
        run: |
          cp staticwebapp.config.json dist/static/ || true
      
      - name: List output files
        run: |
          echo "Contents of dist:"
          ls -la dist/
          echo "Contents of dist/recipefinder:"
          ls -la dist/recipefinder/ || true
          echo "Contents of dist/recipefinder/browser:"
          ls -la dist/recipefinder/browser/ || true
      
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PROUD_PEBBLE_0C07C060F }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "dist/recipefinder"
          api_location: ""
          output_location: ""
          skip_app_build: true
          
  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PROUD_PEBBLE_0C07C060F }}
          action: "close"

