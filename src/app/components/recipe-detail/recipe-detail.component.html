<div class="container mt-4">
  <div class="row">
    <div class="col-lg-12 mx-auto">
      <div class="recipe-detail-card">
        <div class="recipe-header mb-4">
          <div class="d-flex justify-content-between align-items-start mb-3">
            <h1 class="display-4 fw-bold">{{ recipe?.name }}</h1>
            <a routerLink="/recipes" class="btn btn-outline-primary btn-lg">
              <i class="bi bi-arrow-left me-2"></i>Back to Recipes
            </a>
          </div>
          <p class="lead text-muted">{{ recipe?.description }}</p>
        </div>
        <div class="recipe-meta mb-4">
          <div class="row">
            <div class="col-md-3 mb-2">
              <div class="meta-card">
                <i class="bi bi-clock text-primary"></i>
                <span class="d-block">{{ recipe?.time }}</span>
                <small class="text-muted">Cook Time</small>
              </div>
            </div>
            <div class="col-md-3 mb-2">
              <div class="meta-card">
                <i class="bi bi-people text-success"></i>
                <span class="d-block">{{ recipe?.servings }}</span>
                <small class="text-muted">Servings</small>
              </div>
            </div>
            <div class="col-md-3 mb-2">
              <div class="meta-card">
                <i class="bi bi-tag text-warning"></i>
                <span class="d-block">{{ recipe?.category }}</span>
                <small class="text-muted">Category</small>
              </div>
            </div>
            <div class="col-md-3 mb-2">
              <div class="meta-card">
                <i class="bi bi-star text-info"></i>
                <span class="d-block">{{ recipe?.difficulty }}</span>
                <small class="text-muted">Difficulty</small>
              </div>
            </div>
          </div>
        </div>
        <div class="recipe-content-row">
          <div class="row">
            <div class="col-md-4 mb-4 mb-md-0">
              <div class="recipe-image-container">
                <img [src]="recipe?.imageUrl" 
                     [alt]="recipe?.name" 
                     class="img-fluid rounded shadow-lg">
              </div>
            </div>
            <div class="col-md-8">
              <div class="ingredients-instructions-container">
                <div class="ingredients-section">
                  <h3 class="section-title mb-3">
                    <i class="bi bi-list-check me-2 text-primary"></i>Ingredients
                  </h3>
                  <div class="ingredients-container">
                    <ul class="list-group list-group-flush">
                      <li class="list-group-item" *ngFor="let ingredient of recipe?.ingredients; let i = index">
                        <div class="d-flex align-items-center">
                          <span class="badge bg-primary me-3">{{ i + 1 }}</span>
                          <span>{{ ingredient }}</span>
                        </div>
                      </li>
                    </ul>
                  </div>
                </div>
                <div class="instructions-section">
                  <h3 class="section-title mb-3">
                    <i class="bi bi-file-text me-2 text-primary"></i>Instructions
                  </h3>
                  <div class="instructions-steps">
                    <div class="step mb-4" *ngFor="let step of getInstructionSteps(); let i = index">
                      <div class="step-number">{{ i + 1 }}</div>
                      <div class="step-content">
                        <p class="mb-0">{{ step }}</p>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
